# written by ./nook (shared/shell/install.sh): yazi in the Nook palette.
# Only colours; your keys and settings in yazi.toml / keymap.toml stay yours.

[mgr]
cwd = { fg = "#94dcd6" }
find_keyword  = { fg = "#f9c49a", bold = true, italic = true, underline = true }
find_position = { fg = "#f5a8c9", bg = "reset", bold = true, italic = true }
marker_copied   = { fg = "#a6e6bf", bg = "#a6e6bf" }
marker_cut      = { fg = "#f7a59a", bg = "#f7a59a" }
marker_marked   = { fg = "#94dcd6", bg = "#94dcd6" }
marker_selected = { fg = "#c4b2f5", bg = "#c4b2f5" }
count_copied   = { fg = "#1a1614", bg = "#a6e6bf" }
count_cut      = { fg = "#1a1614", bg = "#f7a59a" }
count_selected = { fg = "#1a1614", bg = "#c4b2f5" }
border_symbol = "│"
border_style  = { fg = "#4a3f38" }

[indicator]
parent  = { fg = "#1a1614", bg = "#bfae9f" }
current = { fg = "#1a1614", bg = "#c4b2f5" }
preview = { underline = true }

[tabs]
active   = { fg = "#1a1614", bg = "#c4b2f5", bold = true }
inactive = { fg = "#bfae9f", bg = "#2a2420" }

[mode]
normal_main = { fg = "#1a1614", bg = "#a3cdf5", bold = true }
normal_alt  = { fg = "#a3cdf5", bg = "#2a2420" }
select_main = { fg = "#1a1614", bg = "#a6e6bf", bold = true }
select_alt  = { fg = "#a6e6bf", bg = "#2a2420" }
unset_main  = { fg = "#1a1614", bg = "#e2b5f0", bold = true }
unset_alt   = { fg = "#e2b5f0", bg = "#2a2420" }

[status]
overall   = { fg = "#f6ece4" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type  = { fg = "#a3cdf5" }
perm_read  = { fg = "#f2e29b" }
perm_write = { fg = "#f7a59a" }
perm_exec  = { fg = "#a6e6bf" }
perm_sep   = { fg = "#7d6d62" }
progress_label  = { fg = "#f6ece4", bold = true }
progress_normal = { fg = "#c4b2f5", bg = "#2a2420" }
progress_error  = { fg = "#f7a59a", bg = "#2a2420" }

[input]
border   = { fg = "#c4b2f5" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#c4b2f5" }

[tasks]
border  = { fg = "#c4b2f5" }
title   = {}
hovered = { fg = "#f5a8c9", underline = true }

[which]
mask            = { bg = "#221d1a" }
cand            = { fg = "#94dcd6" }
rest            = { fg = "#7d6d62" }
desc            = { fg = "#f5a8c9" }
separator       = "  "
separator_style = { fg = "#4a3f38" }

[help]
on      = { fg = "#94dcd6" }
run     = { fg = "#f5a8c9" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#1a1614", bg = "#f6ece4" }

[filetype]
rules = [
  { mime = "image/*", fg = "#94dcd6" },
  { mime = "{audio,video}/*", fg = "#f5a8c9" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e2b5f0" },
  { mime = "application/{pdf,doc,rtf}", fg = "#f2e29b" },
  { name = "*", is = "orphan", fg = "#f7a59a" },
  { name = "*", is = "exec", fg = "#a6e6bf" },
  { name = "*/", fg = "#a3cdf5" },
]
