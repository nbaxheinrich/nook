# nook prompt (starship), drawn in Ramen Sign and recoloured to the chosen palette by shared/shell/install.sh.
#
#   ╭─[λ nbax@nobara-pc]─[~/proj/kde-rice]─[git:feat/nook-tile ●2 +1]─[py 3.13]
#   ╰─▶                                                  took 4s · ✗ 1 · 14:55
#
# Tags in brackets like the rest of nook. Red is the accent (λ, ▶, the clock), cyan the
# focus (host), blue paths, cream session, gold git state, orange errors.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
palette = "ramen"

format = """
[╭─](line)$username$hostname$directory$git_branch$git_state$git_status$python$conda$nodejs$rust$container
[╰─](line)$character"""

right_format = "$cmd_duration$status$time"

[palettes.ramen]
line   = "#626262"
faint  = "#7a7a7a"
muted  = "#a8a8a8"
ink    = "#f2f2f2"
red    = "#ff6458"
orange = "#ff9a3c"
gold   = "#ffc247"
aqua   = "#4fd8cf"
cyan   = "#45c8e6"
blue   = "#62a5ff"
cream  = "#ffd98f"
rose   = "#ff7a5c"

[username]
show_always = true
format = "[\\[](line)[λ ](bold red)[$user]($style)"
style_user = "cream"
style_root = "bold orange"

[hostname]
ssh_only = false
format = "[@](faint)[$hostname]($style)[$ssh_symbol](orange)[\\]](line)"
ssh_symbol = " ssh"
style = "cyan"

[directory]
format = "[─\\[](line)[$path]($style)[$read_only]($read_only_style)[\\]](line)"
style = "blue"
read_only = " ro"
read_only_style = "orange"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
format = "[─\\[](line)[git:](faint)[$branch]($style)"
style = "cream"

[git_state]
format = "[ $state $progress_current/$progress_total]($style)"
style = "bold orange"

[git_status]
format = "([ $all_status$ahead_behind]($style))[\\]](line)"
style = "gold"
conflicted = "!$count "
modified = "●$count "
staged = "+$count "
untracked = "?$count "
deleted = "-$count "
renamed = "»$count "
stashed = "≡$count "
ahead = "↑$count"
behind = "↓$count"
diverged = "↑$ahead_count↓$behind_count"

[python]
format = "[─\\[](line)[py $version]($style)( [\\($virtualenv\\)](faint))[\\]](line)"
style = "aqua"
version_format = "${major}.${minor}"

[conda]
format = "[─\\[](line)[conda $environment]($style)[\\]](line)"
style = "aqua"
ignore_base = true

[nodejs]
format = "[─\\[](line)[node $version]($style)[\\]](line)"
style = "aqua"
version_format = "${major}"

[rust]
format = "[─\\[](line)[rust $version]($style)[\\]](line)"
style = "aqua"
version_format = "${major}.${minor}"

[container]
format = "[─\\[](line)[⬢ $name]($style)[\\]](line)"
style = "rose"

[character]
success_symbol = "[▶](bold red)"
error_symbol = "[▶](bold orange)"
vimcmd_symbol = "[◀](bold cyan)"

[cmd_duration]
min_time = 2000
format = "[took ](faint)[$duration]($style)[ · ](line)"
style = "red"

[status]
disabled = false
format = "[✗ $status]($style)[ · ](line)"
style = "bold orange"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "muted"
