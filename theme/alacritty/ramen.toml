# Nook · Ramen Sign for Alacritty (apply.sh --ramen): the same palette as kitty in nook-tile.
# Imported by the alacritty.toml apply.sh writes (that one sets the font, the shell and the env).

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.90
blur = true

[scrolling]
history = 10000

[cursor]
style = { shape = "Block" }

[colors.primary]
background = "#060606"
foreground = "#f2f2f2"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#060606"
cursor = "#4fd8cf"

[colors.selection]
text = "#060606"
background = "#45c8e6"

[colors.normal]
black = "#202020"
red = "#ff6458"
green = "#4fd8cf"
yellow = "#ffc247"
blue = "#62a5ff"
magenta = "#ff7a5c"
cyan = "#45c8e6"
white = "#a8a8a8"

[colors.bright]
black = "#626262"
red = "#ff8c82"
green = "#86ebe4"
yellow = "#ffd87a"
blue = "#8fc0ff"
magenta = "#ffa38a"
cyan = "#7fdcf0"
white = "#f2f2f2"
