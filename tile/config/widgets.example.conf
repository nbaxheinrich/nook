# nook desktop widgets — tile/install.sh copies this ONCE to ~/.config/nook/widgets.conf
# and never overwrites it, so change it there. bin/nook-feed reads it; the widgets
# pick up changes on their next refresh. Weather place and hosts can also be edited live in
# the control center's nook tab (right-click λ nook); that keeps your comments.

[weather]
# a city, "~Eiffel Tower", an airport code … empty = located by IP (wttr.in)
location =
# description language (en, de, …)
lang = en

[srv]
# name = host        ping (ICMP)
# name = host:port   TCP connect, for hosts that drop pings
# no entries = the SRV // HOMELAB widget hides
router = 192.168.1.1
# vps = example.com:22

[cal]
# CalDAV home set. Nextcloud: https://<cloud>/remote.php/dav/calendars/<user>/
# The password (a Nextcloud app password) goes in the keyring: nook-feed cal --setup
# no url = the CAL // NEXT widget hides
url =
user =
# only these calendars (display names, comma separated); empty = all
calendars =
# how far ahead to look
days = 7
