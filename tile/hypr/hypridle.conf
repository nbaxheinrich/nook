# nook-tile idle: lock after 10 minutes.
# Screens-off (dpms) is left out on purpose: Hyprland 0.57's Lua dispatcher
# arguments for hl.dsp.dpms are not documented yet. Add a listener once known.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
