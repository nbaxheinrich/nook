# nook-tile lock screen · Ramen Sign
# hyprlock keeps the hyprlang format (it is not part of Hyprland's Lua config).

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    color = rgb(060606)
}

# big shadow-block clock, the NOOK banner's font, one fire → ice hue per row (bin/nook-lockclock)
label {
    monitor =
    text = cmd[update:1000] $HOME/.local/bin/nook-lockclock
    color = rgb(ff6458)
    font_size = 30
    font_family = JetBrains Mono
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(ff645855)
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d.%m · wk%V" | tr '[:upper:]' '[:lower:]'
    color = rgb(a8a8a8)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = λ $USER@nook — locked
    color = rgb(4fd8cf)
    font_size = 13
    font_family = JetBrains Mono
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 44
    outline_thickness = 1
    rounding = 4
    outer_color = rgb(45c8e6)
    inner_color = rgb(0d0d0d)
    font_color = rgb(f2f2f2)
    check_color = rgb(ffc247)
    fail_color = rgb(ff9a3c)
    capslock_color = rgb(ffc247)
    placeholder_text = <span foreground="##626262">λ ~/ > pass</span>
    fail_text = [!!] $FAIL
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = false
    fade_on_empty = false
    font_family = JetBrains Mono
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = [ ⏎ unlock ]
    color = rgb(626262)
    font_size = 10
    font_family = JetBrains Mono
    position = 0, -130
    halign = center
    valign = center
}
