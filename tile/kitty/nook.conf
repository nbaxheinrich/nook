# nook-tile · kitty in Ramen Sign. install.sh adds `include nook.conf` to kitty.conf.

font_family           JetBrains Mono
font_size             11
window_padding_width  12
background_opacity    0.90
cursor_shape          block
cursor_blink_interval 0.5
confirm_os_window_close 0
enable_audio_bell     no
hide_window_decorations yes

# the Nook shell (prompt and tools as chosen in ./nook) with the candy fastfetch once per window
env NOOK=1
env NOOK_FASTFETCH=${HOME}/.config/fastfetch/candy.jsonc

background            #060606
foreground            #f2f2f2
cursor                #4fd8cf
cursor_text_color     #060606
selection_background  #45c8e6
selection_foreground  #060606
url_color             #62a5ff
active_border_color   #45c8e6
inactive_border_color #343434
active_tab_background   #45c8e6
active_tab_foreground   #0d0d0d
inactive_tab_background #141414
inactive_tab_foreground #a8a8a8
tab_bar_background      #060606

color0   #202020
color8   #626262
color1   #ff6458
color9   #ff8c82
color2   #4fd8cf
color10  #86ebe4
color3   #ffc247
color11  #ffd87a
color4   #62a5ff
color12  #8fc0ff
color5   #ff7a5c
color13  #ffa38a
color6   #45c8e6
color14  #7fdcf0
color7   #a8a8a8
color15  #f2f2f2
