# nook-tile: ssh from kitty. kitty reports TERM=xterm-kitty, which remote machines without kitty's
# terminfo don't know ("Error opening terminal: xterm-kitty" in nano, htop, …), so send a TERM
# every host has. ssh takes the first value it finds: a Host block earlier in ~/.ssh/config that
# sets TERM (say, for a box that has kitty's terminfo) wins over this one.
Host *
    SetEnv TERM=xterm-256color
